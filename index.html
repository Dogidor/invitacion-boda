<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación con animación</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&display=swap" rel="stylesheet">
  <style>
    /* ✅ Versión PC intacta */
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      cursor: pointer;
    }
    .video-wrapper {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16/9;
      position: relative;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
      color: #fff;
      text-align: center;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #nombre, #texto-cupos {
      font-weight: normal;
      text-shadow: none;
    }
    #nombre {
      position: absolute;
      top: 57%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.8rem;
      color: #92aa67;
      font-family: 'Great Vibes', cursive;
    }
    #texto-cupos {
      position: absolute;
      top: 85%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      color: #92aa67;
      font-family: 'Great Vibes', cursive;
    }

    /* 🎨 Botón verde #9FB477 */
    #boton-informacion {
      position: absolute;
      top: 92%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #9FB477; /* verde pastel */
      color: #fff;
      border: none;
      border-radius: 12px; /* puntas redondeadas */
      padding: 8px 18px;
      text-decoration: none;
      font-size: 0.9rem;
      font-family: 'Playfair Display', serif;
      transition: background-color 0.3s ease;
    }
    #boton-informacion:hover {
      background-color: #B5C98E; /* verde más claro al pasar el dedo */
    }

    /* 📱 Versión CELULAR ajustada */
    @media (max-width: 767px) {
      body {
        margin: 0;
        height: 100dvh;
        overflow: hidden;
        display: block;
      }
      .video-wrapper {
        width: 100vw;
        height: 100dvh;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #nombre {
        font-size: 9vw;
        left: 50%;
        transform: translateX(-50%);
      }
      #texto-cupos {
        font-size: 7vw;
        top: 88%; /* nueva ubicación */
        left: 50%;
        transform: translateX(-50%);
      }
      #boton-informacion {
        font-size: 3.5vw;
        padding: 2vw 4vw;
        top: 93.5%;
        left: 50%;
        transform: translateX(-50%);
        background-color: #9FB477;
      }
      #boton-informacion:hover {
        background-color: #B5C98E;
      }
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <video id="video" playsinline>
      <source id="videoSource" src="Singular.Mp4.mp4" type="video/mp4" />
    </video>

    <section id="overlay">
      <h1 id="nombre"></h1>
      <p><span id="texto-cupos"></span></p>
      <a id="boton-informacion" href="https://platypus-497yjd.my.canva.site/boda-feliz-andres-natalia">
        Ver más información 🤍
      </a>
    </section>
  </div>

  <script>
    async function cargarInvitado() {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;

      try {
        const respuesta = await fetch("invitados.json");
        const invitados = await respuesta.json();
        const invitado = invitados[id];
        if (!invitado) {
          console.error("Invitado no encontrado en invitados.json");
          return;
        }

        const videoSource = document.getElementById("videoSource");
        const video = document.getElementById("video");

        videoSource.src = invitado.cupos > 1 ? "Plural.Mp4.mp4" : "Singular.Mp4.mp4";
        video.load();

        document.body.addEventListener("click", () => {
          video.play();
        }, { once: true });

        video.addEventListener("timeupdate", () => {
          if (video.currentTime >= 22) {
            const overlay = document.getElementById("overlay");
            overlay.style.display = "block";
            overlay.style.animation = "fadeIn 2s ease forwards";

            const nombreElemento = document.getElementById("nombre");
            nombreElemento.textContent = invitado.nombre;

            // Ajuste dinámico según longitud del nombre
            if (invitado.nombre.length > 8) {
              nombreElemento.style.top = "57%";
            } else {
              nombreElemento.style.top = "62%";
            }

            document.getElementById("texto-cupos").textContent =
              invitado.cupos === 1 ? "1 cupo" : `${invitado.cupos} cupos`;
          }
        });

        video.addEventListener("ended", () => {
          video.pause();
          video.currentTime = video.duration;
        });
      } catch (error) {
        console.log("Error cargando invitado:", error);
      }
    }
    cargarInvitado();
  </script>
</body>
</html>
