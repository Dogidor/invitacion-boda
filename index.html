<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Una invitación especial</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .video-wrapper {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16/9;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between; /* distribuye arriba y abajo */
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 2.8rem;
      margin: 0;
      color: #92aa67; /* mismo color para nombre y cupos */
      opacity: 0;
      animation: slideDown 1.5s ease forwards;
      animation-delay: 0.3s;
    }
    .mensaje {
      font-size: 1.5rem;
      margin: 0;
      color: #92aa67; /* mismo color que el nombre */
      opacity: 0;
      animation: fadeInScale 1.5s ease forwards;
      animation-delay: 1s;
    }
    .boton {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 999px;
      background: #e4e8d5;
      color: #4a4a4a;
      text-decoration: none;
      font-size: 1rem;
      opacity: 0;
      animation: fadeUp 1.5s ease forwards;
      animation-delay: 1.8s;
    }
    @keyframes slideDown {
      from {opacity:0; transform: translateY(-30px);}
      to {opacity:1; transform: translateY(0);}
    }
    @keyframes fadeInScale {
      from {opacity:0; transform: scale(0.9);}
      to {opacity:1; transform: scale(1);}
    }
    @keyframes fadeUp {
      from {opacity:0; transform: translateY(20px);}
      to {opacity:1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <video id="video" playsinline preload="metadata" muted>
      <source id="videoSource" src="" type="video/mp4" />
      Tu navegador no puede reproducir este video.
    </video>

    <section id="overlay">
      <!-- Parte superior -->
      <div>
        <h1 id="nombre"></h1>
        <p class="mensaje"><span id="texto-cupos"></span></p>
      </div>
      <!-- Parte inferior -->
      <a id="boton-informacion" class="boton" href="https://platypus-497yjd.my.canva.site/boda-feliz-andres-natalia">
        Ver más información 🤍
      </a>
    </section>
  </div>

  <script>
    async function cargarInvitado() {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;

      try {
        const respuesta = await fetch("invitados.json");
        const invitados = await respuesta.json();
        const invitado = invitados[id];
        if (!invitado) return;

        // Selección de video según cupos
        const videoSource = document.getElementById("videoSource");
        videoSource.src = invitado.cupos > 1 ? "Plural.Mp4.mp4" : "Singular.Mp4.mp4";

        const video = document.getElementById("video");
        video.load();

        // Al tocar la pantalla, inicia con sonido
        video.addEventListener("click", () => {
          video.muted = false;
          video.play();
        });

        // Mostrar nombre y cupos en el segundo 25
        video.addEventListener("timeupdate", () => {
          if (video.currentTime >= 25) {
            const overlay = document.getElementById("overlay");
            overlay.style.display = "flex";
            document.getElementById("nombre").textContent = invitado.nombre;
            document.getElementById("texto-cupos").textContent =
              invitado.cupos === 1 ? "1 cupo" : `${invitado.cupos} cupos`;
          }
        });
      } catch (error) {
        console.log("Error cargando invitado:", error);
      }
    }

    cargarInvitado();
  </script>
</body>
</html>
