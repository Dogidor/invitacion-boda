<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación Especial</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      background: #fdf6f0;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* --- SOBRE --- */
    .sobre {
      position: relative;
      width: min(90%, 320px);
      height: 200px;
      background: #fff;
      border: 2px solid #d4a373;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      cursor: pointer;
      perspective: 1000px;
      transition: transform 0.8s ease;
    }
    .flap {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100px;
      background: #d4a373;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      transition: transform 1s ease;
    }
    .sobre.abierto .flap { transform: rotateX(180deg); }

    /* --- MARIPOSAS --- */
    .mariposa {
      position: absolute;
      width: 36px; height: 36px;
      background: url('https://cdn-icons-png.flaticon.com/512/1998/1998610.png') no-repeat center/contain;
      opacity: 0;
      animation: volar 5s ease-in-out forwards;
    }
    @keyframes volar {
      0% { opacity: 0; transform: translateY(0) scale(0.5); }
      20% { opacity: 1; }
      100% { transform: translate(-150px, -350px) rotate(360deg) scale(1); opacity: 0; }
    }

    /* --- INVITACIÓN --- */
    .invitacion {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      animation: aparecer 1s ease forwards;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2rem, 8vw, 3rem);
      color: #92aa67;
      margin: 0 0 12px;
    }
    p {
      max-width: 360px;
      font-size: clamp(1rem, 4vw, 1.2rem);
      line-height: 1.4;
      color: #333;
    }
    a {
      margin-top: 15px;
      padding: 10px 20px;
      border-radius: 999px;
      background: #e4e8d5;
      color: #4a4a4a;
      text-decoration: none;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <!-- SOBRE -->
  <div class="sobre" id="sobre">
    <div class="flap"></div>
  </div>

  <!-- INVITACIÓN -->
  <div class="invitacion" id="invitacion">
    <h1>Andrés & Natalia</h1>
    <p>Esta historia no sería la misma sin ti; por eso hemos reservado <strong>2 cupos</strong> para que nos acompañes en nuestro gran día.</p>
    <a href="https://platypus-497yjd.my.canva.site/boda-feliz-andres-natalia">Ver más información 🤍</a>
  </div>

  <script>
    const sobre = document.getElementById("sobre");
    const invitacion = document.getElementById("invitacion");

    sobre.addEventListener("click", () => {
      sobre.classList.add("abierto");
      for (let i = 0; i < 6; i++) {
        const mariposa = document.createElement("div");
        mariposa.className = "mariposa";
        mariposa.style.left = "50%";
        mariposa.style.top = "50%";
        mariposa.style.animationDelay = `${i * 0.4}s`;
        document.body.appendChild(mariposa);
        setTimeout(() => mariposa.remove(), 5000);
      }
      setTimeout(() => {
        sobre.style.display = "none";
        invitacion.style.display = "flex";
      }, 2200);
    });
  </script>
</body>
</html>
