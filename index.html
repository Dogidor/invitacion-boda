<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Una invitación especial</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    :root { --fondo: #fffdf9; --texto: #202020; --boton: #e4e8d5; --boton-texto: #4a4a4a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f1f0ec; color: var(--texto); font-family: Georgia, "Times New Roman", serif; }

    /* Animación inicial romántica */
    body {
      opacity: 0;
      filter: blur(12px);
      animation: aparecer 2.2s ease-out forwards;
    }
    @keyframes aparecer {
      0% { opacity: 0; filter: blur(12px); }
      50% { opacity: 0.5; filter: blur(6px); }
      100% { opacity: 1; filter: blur(0); }
    }

    /* Destellos mágicos */
    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,0.6) 2px, transparent 2px);
      background-size: 120px 120px;
      animation: destellos 6s linear infinite;
      z-index: 1;
    }
    @keyframes destellos {
      from { background-position: 0 0; }
      to { background-position: 120px 120px; }
    }

    .invitacion { width: min(100%, 480px); height: 100svh; margin: 0 auto; background: var(--fondo); overflow: hidden; display: flex; flex-direction: column; position: relative; z-index: 2; }
    .video-contenedor { width: 100%; flex: 1 1 auto; min-height: 0; background: #171717; position: relative; }
    video { display: block; width: 100%; height: 100%; object-fit: cover; filter: blur(12px) brightness(0.6); transition: filter 1s ease; }
    video.activo { filter: blur(0) brightness(1); }

    .contenido { flex: 0 0 270px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 28px 18px; text-align: center; }
    h1 { margin: 0 0 12px; font-family: "Great Vibes", cursive; font-size: clamp(2.65rem, 10.5vw, 3.65rem); font-weight: 400; line-height: 0.9; color: #92aa67; }
    .mensaje { max-width: 380px; margin: 0 auto; font-size: clamp(0.98rem, 4vw, 1.12rem); line-height: 1.34; letter-spacing: 0.01em; }
    .boton { display: inline-flex; align-items: center; justify-content: center; min-width: 218px; min-height: 48px; margin-top: 17px; padding: 11px 24px; border-radius: 999px; background: var(--boton); color: var(--boton-texto); font-size: 1rem; text-decoration: underline; text-underline-offset: 3px; transition: transform 160ms ease, filter 160ms ease; cursor: pointer; }
    .boton:hover { filter: brightness(0.95); transform: translateY(-1px); }

    /* Botón con ícono verde */
    .sonido-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      width: 54px;
      height: 54px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sonido-btn img {
      width: 28px;
      height: 28px;
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    .sonido-btn.activo img {
      transform: scale(1.2); /* efecto de clic */
      filter: brightness(1.3);
    }
    .sonido-btn:hover { background: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <!-- Destellos mágicos -->
  <div class="sparkle"></div>

  <!-- Invitación -->
  <main id="invitacion" class="invitacion">
    <div class="video-contenedor">
      <video id="video" loop playsinline preload="metadata">
        <source src="DISNEY-AMOR.mp4" type="video/mp4" />
        Tu navegador no puede reproducir este video.
      </video>
      <button id="sonidoBtn" class="sonido-btn">
        <img id="iconoBtn" src="https://cdn-icons-png.flaticon.com/512/555/555159.png" alt="Play/Pause">
      </button>
    </div>
    <section class="contenido">
      <h1 id="nombre">[Nombre]</h1>
      <p class="mensaje">Esta historia no sería la misma sin ti. Hemos reservado <span id="texto-cupos">[X] cupo(s)</span> para que nos acompañes en nuestro gran día.</p>
      <a id="boton-informacion" class="boton" href="https://platypus-497yjd.my.canva.site/boda-feliz-andres-natalia">Ver más información 🤍</a>
    </section>
  </main>

  <script>
    async function cargarInvitado() {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;
      try {
        const respuesta = await fetch("invitados.json");
        const invitados = await respuesta.json();
        const invitado = invitados[id];
        if (!invitado) return;
        document.getElementById("nombre").textContent = invitado.nombre;
        document.getElementById("texto-cupos").textContent = invitado.cupos === 1 ? "1 cupo" : `${invitado.cupos} cupos`;
      } catch (error) {
        console.log("No se pudieron cargar los datos de la invitación.", error);
      }
    }

    const video = document.getElementById("video");
    const sonidoBtn = document.getElementById("sonidoBtn");

    // Primer toque en cualquier parte: activa video + sonido y aclara
    function activarVideo() {
      video.muted = false;
      video.play();
      video.classList.add("activo");
      document.removeEventListener("click", activarVideo);
      document.removeEventListener("touchstart", activarVideo);
    }
    document.addEventListener("click", activarVideo);
    document.addEventListener("touchstart", activarVideo);

    // Botón para pausar/reanudar
    sonidoBtn.addEventListener("click", () => {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
      sonidoBtn.classList.add("activo");
      setTimeout(() => sonidoBtn.classList.remove("activo"), 300);
    });

    cargarInvitado();
  </script>
</body>
</html>
