<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invitación de Matrimonio</title>
  <style>
    body, html { margin:0; padding:0; height:100%; font-family:Arial, sans-serif; }
    .video-bg { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-1; }
    .overlay { position:relative; text-align:center; color:white; margin-top:20%; }
    button { margin-top:20px; padding:10px 20px; font-size:18px; cursor:pointer; }
    #invitacion { display:none; padding:20px; background:white; color:black; margin:20px; border-radius:8px; }
  </style>
</head>
<body>
  <!-- Video de fondo -->
  <video autoplay muted loop class="video-bg">
    <source src="video.mp4" type="video/mp4">
    Tu navegador no soporta video.
  </video>

  <!-- Texto y botón -->
  <div class="overlay">
    <h1 id="nombre"></h1>
    <button onclick="mostrarInvitacion()">Ver más</button>
  </div>

  <!-- Invitación genérica -->
  <div id="invitacion">
    <h2>Invitación al Matrimonio</h2>
    <p>Queremos compartir contigo este día tan especial. ¡Te esperamos!</p>
  </div>

  <script>
    // Captura el nombre desde la URL
    const params = new URLSearchParams(window.location.search);
    const invitado = params.get("nombre") || "Invitado";
    document.getElementById("nombre").innerText = "Bienvenido " + invitado;

    // Función para mostrar la invitación
    function mostrarInvitacion() {
      document.getElementById("invitacion").style.display = "block";
    }
  </script>
</body>
</html>
