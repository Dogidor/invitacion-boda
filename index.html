<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación con animación</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 101vh; /* 1% más abajo */
    }
    .video-wrapper {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16/9;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
      color: #fff;
      text-align: center;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Textos con sombreado */
    #nombre, #texto-cupos, #boton-informacion {
      text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
    }
    #nombre {
      position: absolute;
      top: 57%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.8rem;
      color: #92aa67;
      font-family: 'Great Vibes', cursive;
      font-weight: normal;
    }
    #texto-cupos {
      position: absolute;
      top: 85%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      color: #92aa67;
      font-family: 'Great Vibes', cursive;
      font-weight: normal;
    }
    #boton-informacion {
      position: absolute;
      top: 92%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(228,232,213,0.95); /* mucho más sólido */
      color: #000;
      padding: 6px 14px;
      border: 1px solid #e4e8d5;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.9rem;
      font-family: 'Playfair Display', serif;
      transition: all 0.3s ease;
    }
    #boton-informacion:hover {
      background: #e4e8d5;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <!-- Video en loop eterno con audio incrustado y poster final -->
    <video id="video" autoplay loop playsinline poster="ultima_imagen.jpg">
      <source id="videoSource" src="video_con_audio.mp4" type="video/mp4" />
    </video>

    <section id="overlay">
      <h1 id="nombre"></h1>
      <p><span id="texto-cupos"></span></p>
      <a id="boton-informacion" href="https://dogidor.github.io/invitacion-boda/?id=lala">
        Ver más información 🤍
      </a>
    </section>
  </div>

  <script>
    async function cargarInvitado() {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;

      try {
        const respuesta = await fetch("invitados.json");
        const invitados = await respuesta.json();
        const invitado = invitados[id];
        if (!invitado) return;

        const videoSource = document.getElementById("videoSource");
        videoSource.src = invitado.cupos > 1 ? "Plural_con_audio.mp4" : "Singular_con_audio.mp4";

        const video = document.getElementById("video");
        video.load();

        // Mostrar nombre y cupos en el segundo 22
        video.addEventListener("timeupdate", () => {
          if (video.currentTime >= 22) {
            const overlay = document.getElementById("overlay");
            overlay.style.display = "block";
            overlay.style.animation = "fadeIn 2s ease forwards";
            document.getElementById("nombre").textContent = invitado.nombre;
            document.getElementById("texto-cupos").textContent =
              invitado.cupos === 1 ? "1 cupo" : `${invitado.cupos} cupos`;
          }
        });
      } catch (error) {
        console.log("Error cargando invitado:", error);
      }
    }
    cargarInvitado();
  </script>
</body>
</html>
