<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación con regla</title>
  <!-- Fuente elegante -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .video-wrapper {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16/9;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
      color: #fff;
      text-align: center;
    }
    #nombre {
      position: absolute;
      top: 57%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.8rem;
      color: #92aa67;
      font-family: 'Great Vibes', cursive;
      font-weight: normal;
    }
    #texto-cupos {
      position: absolute;
      top: 86%; /* ajustado */
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      color: #92aa67;
      font-family: 'Great Vibes', cursive;
      font-weight: normal;
    }
    #boton-informacion {
      position: absolute;
      top: 95%; /* ajustado */
      left: 50%;
      transform: translateX(-50%);
      background: #e4e8d5;
      color: #4a4a4a;
      padding: 10px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 1rem;
      font-family: 'Playfair Display', serif;
    }

    /* Regla completa con marcas */
    .regla {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .regla div {
      position: absolute;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.3);
    }
    .regla span {
      position: absolute;
      left: 5px;
      font-size: 12px;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 2px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <video id="video" playsinline preload="metadata" muted>
      <source id="videoSource" src="" type="video/mp4" />
    </video>

    <!-- Audio separado en loop infinito -->
    <audio id="audio">
      <source src="musica.mp3" type="audio/mp3" />
    </audio>

    <section id="overlay">
      <h1 id="nombre"></h1>
      <p><span id="texto-cupos"></span></p>
      <a id="boton-informacion" href="https://platypus-497yjd.my.canva.site/boda-feliz-andres-natalia">
        Ver más información 🤍
      </a>
    </section>

    <!-- Regla de referencia -->
    <div class="regla">
      <div style="top:57%"><span>57%</span></div>
      <div style="top:86%"><span>86%</span></div>
      <div style="top:95%"><span>95%</span></div>
    </div>
  </div>

  <script>
    async function cargarInvitado() {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;

      try {
        const respuesta = await fetch("invitados.json");
        const invitados = await respuesta.json();
        const invitado = invitados[id];
        if (!invitado) return;

        const videoSource = document.getElementById("videoSource");
        videoSource.src = invitado.cupos > 1 ? "Plural.Mp4.mp4" : "Singular.Mp4.mp4";

        const video = document.getElementById("video");
        const audio = document.getElementById("audio");
        video.load();

        // Al tocar la pantalla, inicia video y audio
        video.addEventListener("click", () => {
          video.muted = false;
          video.play();
          audio.play();
        });

        // Mostrar nombre y cupos en el segundo 25
        video.addEventListener("timeupdate", () => {
          if (video.currentTime >= 25) {
            document.getElementById("overlay").style.display = "block";
            document.getElementById("nombre").textContent = invitado.nombre;
            document.getElementById("texto-cupos").textContent =
              invitado.cupos === 1 ? "1 cupo" : `${invitado.cupos} cupos`;
          }
        });

        // Forzar loop infinito del audio
        audio.addEventListener("ended", () => {
          audio.currentTime = 0;
          audio.play();
        });

        // Si el video termina, el audio sigue
        video.addEventListener("ended", () => {
          if (audio.paused) audio.play();
        });
      } catch (error) {
        console.log("Error cargando invitado:", error);
      }
    }
    cargarInvitado();
  </script>
</body>
</html>
